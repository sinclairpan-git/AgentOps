rules:
  - rule_id: zh-cn-first
    category: absolute
    description: Console visible copy must be Chinese-first except fixed terms and contract field names.
  - rule_id: no-raw-material
    category: absolute
    description: Frontend must not display raw payloads, download links, PR text, token values, or private keys.
  - rule_id: no-verified-loaded-spoofing
    category: absolute
    description: materialized or unverified adapter state must not be rendered as verified_loaded.
  - rule_id: no-automatic-lifecycle
    category: absolute
    description: Console must not automatically approve, write back, publish, delist, or merge production actions.
