openapi: 3.1.0
info:
  title: AgentOps Trusted Loop API
  version: 0.1.0
paths:
  /v1/events/batch:
    post:
      summary: Ingest EventEnvelope v1 events
      operationId: ingestEventsBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  items:
                    $ref: "./event-envelope-v1.schema.yaml"
      responses:
        "202":
          description: Accepted or deduplicated events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionResult"
        "400":
          description: Schema or integration mode error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Signature or token error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/bootstrap/credentials:
    post:
      summary: Issue ReporterCredential, IngestionToken, and DeviceKey
      operationId: issueCredentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialIssueRequest"
      responses:
        "201":
          description: Credential issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialIssueResponse"
        "409":
          description: Expired or invalid bootstrap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/bootstrap/credentials/{bootstrap_id}:
    get:
      summary: Read AgentOps-owned credential bootstrap status for Agent Store display
      operationId: getCredentialStatus
      parameters:
        - name: bootstrap_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: AgentOps credential status echo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialStatusResponse"
        "404":
          description: Credential status not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/bootstrap/credentials/{bootstrap_id}/revoke:
    post:
      summary: Revoke AgentOps-owned credential and propagate display-only reissue state
      operationId: revokeCredentials
      parameters:
        - name: bootstrap_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialRevocationRequest"
      responses:
        "200":
          description: Credential revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialRevocationResponse"
        "400":
          description: Unsupported revocation schema or scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Credential revocation target not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/bootstrap/credentials/{bootstrap_id}/reissue:
    post:
      summary: Reissue an AgentOps-owned replacement credential after revocation
      operationId: reissueCredentials
      parameters:
        - name: bootstrap_id
          in: path
          required: true
          description: Revoked source bootstrap id.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialReissueRequest"
      responses:
        "200":
          description: Replacement credential issued by AgentOps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialReissueResponse"
        "400":
          description: Unsupported reissue schema, non-revoked source, reused nonce, or target conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Reissue source credential not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/runs/{run_id}/evidence-summary:
    get:
      summary: Read redacted evidence summary for a run
      operationId: getEvidenceSummary
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Redacted evidence summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceSummary"
        "403":
          description: Raw access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/policy/decision:
    post:
      summary: Evaluate or retrieve a PolicyDecision
      operationId: evaluatePolicyDecision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyDecisionRequest"
      responses:
        "200":
          description: Policy decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDecision"
        "400":
          description: Policy scope missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/store-summary/{agent_id}:
    get:
      summary: Agent Store consumable AgentOps summary
      operationId: getAgentStoreSummary
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: query
          required: true
          schema:
            type: string
        - name: run_id
          in: query
          required: true
          schema:
            type: string
        - name: schema_version
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Agent Store summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStoreSummary"
        "400":
          description: Required summary query is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Summary run source was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Summary schema unsupported or run target mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    IngestionResult:
      type: object
      required: [accepted, rejected, deduplicated]
      properties:
        accepted:
          type: array
          items:
            type: string
        rejected:
          type: array
          items:
            $ref: "#/components/schemas/EventError"
        deduplicated:
          type: array
          items:
            type: string
    EventError:
      type: object
      required: [event_id, error_code, retryable]
      properties:
        event_id:
          type: string
        error_code:
          type: string
        retryable:
          type: boolean
        human_action_required:
          type: boolean
    CredentialIssueRequest:
      type: object
      required:
        - schema_version
        - bootstrap_id
        - installation_assertion
        - device_proof
      properties:
        schema_version:
          type: string
          enum: [agentops_credential_handoff.v1]
        bootstrap_id:
          type: string
        trace_id:
          type: string
        audit_id:
          type: string
        return_url:
          type: string
        installation_assertion:
          $ref: "#/components/schemas/InstallationAssertion"
        device_proof:
          $ref: "#/components/schemas/DeviceProof"
    InstallationAssertion:
      type: object
      required:
        - assertion_version
        - issuer
        - key_id
        - algorithm
        - canonicalization
        - signature
        - assertion_hash
        - installation_id
        - device_id
        - device_public_key_thumbprint
        - agent_id
        - agent_version
        - artifact_hash
        - user_id
        - audience
        - nonce
        - replay_window_seconds
        - issued_at
        - expires_at
        - revocation_status
      properties:
        assertion_version:
          type: string
          enum: [signed_installation_assertion.v1]
        issuer:
          type: string
          enum: [agent-store]
        key_id:
          type: string
        algorithm:
          type: string
        canonicalization:
          type: string
          enum: [json-c14n-v1]
        signature:
          type: string
        assertion_hash:
          type: string
        installation_id:
          type: string
        device_id:
          type: string
        device_public_key_thumbprint:
          type: string
        agent_id:
          type: string
        agent_version:
          type: string
        artifact_hash:
          type: string
        user_id:
          type: string
        audience:
          type: string
          enum: [agentops]
        nonce:
          type: string
        replay_window_seconds:
          type: integer
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revocation_status:
          type: string
          enum: [not_revoked, revoked, unknown]
    DeviceProof:
      type: object
      required:
        - proof_version
        - installation_id
        - device_id
        - public_key_hash
        - key_id
        - algorithm
        - canonicalization
        - nonce
        - assertion_hash
        - signature
        - issued_at
        - expires_at
      properties:
        proof_version:
          type: string
          enum: [device_proof.v1]
        installation_id:
          type: string
        device_id:
          type: string
        public_key_hash:
          type: string
        key_id:
          type: string
        algorithm:
          type: string
        canonicalization:
          type: string
          enum: [json-c14n-v1]
        nonce:
          type: string
        assertion_hash:
          type: string
        signature:
          type: string
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    CredentialIssueResponse:
      type: object
      required: [credential_id, token_id, device_key_id, status, bootstrap_status, installation_id, device_id, expires_at, next_action]
      properties:
        credential_id:
          type: string
        token_id:
          type: string
        device_key_id:
          type: string
        status:
          type: string
          enum: [active, rotating, expired, revoked]
        bootstrap_status:
          type: string
          enum: [credential_issued]
        installation_id:
          type: string
        device_id:
          type: string
        expires_at:
          type: string
          format: date-time
        next_action:
          type: string
          enum: [send_signature_test_event]
    CredentialRevocationRequest:
      type: object
      required: [schema_version, revocation_id, revoked_by, reason, scope]
      properties:
        schema_version:
          type: string
          enum: [agentops_credential_revocation.v1]
        revocation_id:
          type: string
        revoked_by:
          type: string
        reason:
          type: string
        scope:
          type: string
          enum: [credential, credential_and_device_key, installation]
    CredentialRevocationResponse:
      type: object
      required:
        - schema_version
        - bootstrap_id
        - credential_id
        - credential_status
        - bootstrap_status
        - revocation_id
        - revoked_at
        - revoked_by
        - revocation_reason
        - revocation_scope
        - next_action
        - agentops_fact_owner
        - agent_store_consumer_boundary
        - verified_loaded
        - l5_status
      properties:
        schema_version:
          type: string
          enum: [agentops_credential_revocation.v1]
        bootstrap_id:
          type: string
        credential_id:
          type: string
        credential_status:
          type: string
          enum: [revoked]
        bootstrap_status:
          type: string
          enum: [revoked]
        revocation_id:
          type: string
        revoked_at:
          type: string
          format: date-time
        revoked_by:
          type: string
        revocation_reason:
          type: string
        revocation_scope:
          type: string
          enum: [credential, credential_and_device_key, installation]
        next_action:
          type: string
          enum: [reissue_credential]
        agentops_fact_owner:
          type: string
          enum: [agentops]
        agent_store_consumer_boundary:
          type: string
          enum: [display_only_no_active_inference]
        verified_loaded:
          type: string
          enum: [not_asserted]
        l5_status:
          type: string
          enum: [not_asserted]
    CredentialReissueRequest:
      type: object
      required: [schema_version, new_bootstrap_id, reissue_id, requested_by, reason, credential_handoff]
      properties:
        schema_version:
          type: string
          enum: [agentops_credential_reissue.v1]
        new_bootstrap_id:
          type: string
          description: Fresh bootstrap id for the replacement credential. Must differ from the revoked source id.
        reissue_id:
          type: string
        requested_by:
          type: string
        reason:
          type: string
        credential_handoff:
          $ref: "#/components/schemas/CredentialIssueRequest"
    CredentialReissueResponse:
      type: object
      required:
        - schema_version
        - source_bootstrap_id
        - reissued_bootstrap_id
        - reissue_id
        - requested_by
        - reason
        - old_credential_status
        - credential_id
        - token_id
        - device_key_id
        - credential_status
        - bootstrap_status
        - installation_id
        - device_id
        - expires_at
        - next_action
        - agentops_fact_owner
        - agent_store_consumer_boundary
        - verified_loaded
        - l5_status
      properties:
        schema_version:
          type: string
          enum: [agentops_credential_reissue.v1]
        source_bootstrap_id:
          type: string
        reissued_bootstrap_id:
          type: string
        reissue_id:
          type: string
        requested_by:
          type: string
        reason:
          type: string
        old_credential_status:
          type: string
          enum: [revoked]
        credential_id:
          type: string
        token_id:
          type: string
          description: Identifier only; never a token secret value.
        device_key_id:
          type: string
        credential_status:
          type: string
          enum: [active]
        bootstrap_status:
          type: string
          enum: [credential_issued]
        installation_id:
          type: string
        device_id:
          type: string
        expires_at:
          type: string
          format: date-time
        next_action:
          type: string
          enum: [send_signature_test_event]
        agentops_fact_owner:
          type: string
          enum: [agentops]
        agent_store_consumer_boundary:
          type: string
          enum: [display_only_no_active_inference]
        verified_loaded:
          type: string
          enum: [not_asserted]
        l5_status:
          type: string
          enum: [not_asserted]
    CredentialStatusResponse:
      type: object
      required:
        - schema_version
        - bootstrap_id
        - bootstrap_status
        - credential_status
        - credential_id
        - token_id
        - device_key_id
        - installation_id
        - device_id
        - expires_at
        - next_action
        - agentops_fact_owner
        - agent_store_consumer_boundary
        - agent_store_allowed_actions
        - agent_store_forbidden_actions
        - verified_loaded
        - l5_status
      properties:
        schema_version:
          type: string
          enum: [agentops_credential_status.v1]
        bootstrap_id:
          type: string
        bootstrap_status:
          type: string
          enum: [credential_issued, signature_verified, revoked]
        credential_status:
          type: string
          enum: [active, rotating, expired, revoked, unknown]
        credential_id:
          type: string
        token_id:
          type: string
          description: Identifier only; never a token secret value.
        device_key_id:
          type: string
        installation_id:
          type: string
        device_id:
          type: string
        expires_at:
          type: string
          format: date-time
        next_action:
          type: string
          enum: [send_signature_test_event, display_activation_result, reissue_credential]
        signature_test_event_id:
          type: [string, "null"]
        revocation_id:
          type: [string, "null"]
        revoked_at:
          type: [string, "null"]
          format: date-time
        revoked_by:
          type: [string, "null"]
        revocation_reason:
          type: [string, "null"]
        revocation_scope:
          type: [string, "null"]
        revocation_resolution:
          type: [string, "null"]
          enum: [reissued, null]
        reissue_id:
          type: [string, "null"]
        reissued_at:
          type: [string, "null"]
          format: date-time
        reissued_by:
          type: [string, "null"]
        reissued_bootstrap_id:
          type: [string, "null"]
        reissued_credential_id:
          type: [string, "null"]
        agentops_fact_owner:
          type: string
          enum: [agentops]
        agent_store_consumer_boundary:
          type: string
          enum: [display_only_no_active_inference]
        agent_store_allowed_actions:
          type: array
          items:
            type: string
            enum: [display_status, show_next_action]
        agent_store_forbidden_actions:
          type: array
          items:
            type: string
            enum: [infer_active, issue_credential, issue_ingestion_token, issue_device_key]
        verified_loaded:
          type: string
          enum: [not_asserted]
        l5_status:
          type: string
          enum: [not_asserted]
    EvidenceSummary:
      type: object
      required:
        - run_id
        - evidence_level
        - confidence
        - missing_evidence
        - raw_access_state
        - linked_event_ids
        - data_classification
        - redaction_policy
        - access_policy
        - retention_policy
        - redacted_summary
        - payload_hash
        - source_trust
        - completeness
        - freshness
        - downgrade_reason
      properties:
        run_id:
          type: string
        evidence_level:
          type: string
          enum: [L1, L2, L3, L4, L5, pending, unknown]
        confidence:
          type: number
        missing_evidence:
          type: array
          items:
            type: string
        raw_access_state:
          type: string
          enum: [not_available, summary_only, requestable, approved, denied, expired]
        linked_event_ids:
          type: array
          items:
            type: string
        data_classification:
          type: string
          enum: [public, internal, confidential, restricted]
        redaction_policy:
          type: string
        access_policy:
          type: string
        retention_policy:
          type: string
        redacted_summary:
          type: object
        payload_hash:
          type: string
        source_trust:
          type: string
          enum: [verified, declared, ai_suggested, imported, suspected]
        completeness:
          type: number
          minimum: 0
          maximum: 1
        freshness:
          type: string
          enum: [fresh, stale, unknown]
        downgrade_reason:
          type: string
    PolicyDecisionRequest:
      type: object
      required: [action]
      properties:
        run_id:
          type: string
        skill_id:
          type: string
        action:
          type: string
          enum: [read, write, execute, network, deploy, config_change]
        resource_scope:
          type: object
    PolicyDecision:
      type: object
      required: [decision, fallback_action, policy_version, decision_reason, audit_id]
      properties:
        decision:
          type: string
          enum: [block, approval_required, warn, conditional_allow, allow]
        fallback_action:
          type: string
          enum: [allow, warn, block, require_online]
        policy_version:
          type: string
        decision_reason:
          type: string
        audit_id:
          type: string
    AgentStoreSummary:
      type: object
      required:
        - schema_version
        - agent_id
        - metadata_state
        - agentops_fact_owner
        - registry_fact_owner
        - agent_store_consumer_boundary
        - score_template_id
        - evidence_level
        - confidence
        - missing_evidence
        - risk_state
        - approval_state
        - quality_state
        - raw_access_state
        - redaction_policy
        - data_classification
        - policy_requirement
        - discovery_gap_ids
        - run_audit
        - calculated_at
        - valid_until
        - deep_links
      properties:
        schema_version:
          type: string
          enum: [agentops.agent_store.echo.v1]
        agent_id:
          type: string
        agent_version:
          type: string
        metadata_state:
          type: string
          enum: [registered, unregistered, unknown]
        agentops_fact_owner:
          type: string
          enum: [AgentOps]
        registry_fact_owner:
          type: string
          enum: [Agent Store]
        agent_store_consumer_boundary:
          $ref: "#/components/schemas/AgentStoreConsumerBoundary"
        evidence_level:
          type: string
          enum: [L1, L2, L3, L4, L5, pending, unknown]
        confidence:
          type: number
        missing_evidence:
          type: array
          items:
            type: string
        risk_state:
          type: string
          enum: [normal, warning, blocked, unknown]
        approval_state:
          type: string
          enum: [none, pending, approved, rejected, expired]
        quality_state:
          $ref: "#/components/schemas/AgentOpsQualityState"
        raw_access_state:
          type: string
          enum: [summary_only, approved]
        redaction_policy:
          type: string
        data_classification:
          type: string
        policy_requirement:
          $ref: "#/components/schemas/AgentOpsPolicyRequirement"
        discovery_gap_ids:
          type: array
          items:
            type: string
        run_audit:
          $ref: "#/components/schemas/AgentStoreRunAuditSummary"
        score_template_id:
          type: string
        calculated_at:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        deep_links:
          $ref: "#/components/schemas/AgentOpsDeepLinks"
    AgentStoreConsumerBoundary:
      type: object
      required:
        - mode
        - summary_fact_owner
        - registry_fact_owner
        - allowed_actions
        - forbidden_actions
      properties:
        mode:
          type: string
          enum: [display_only]
        summary_fact_owner:
          type: string
          enum: [AgentOps]
        registry_fact_owner:
          type: string
          enum: [Agent Store]
        allowed_actions:
          type: array
          items:
            type: string
        forbidden_actions:
          type: array
          items:
            type: string
    AgentOpsQualityState:
      type: object
      required: [source, source_trust, completeness, freshness]
      properties:
        source:
          type: string
          enum: [AgentOps]
        source_trust:
          type: string
          enum: [verified, declared]
        completeness:
          type: number
        freshness:
          type: string
    AgentOpsPolicyRequirement:
      type: object
      required:
        - required_by
        - source
        - issuer
        - policy_owner
        - policy_version
        - can_ignore
        - affected_actions
      properties:
        required_by:
          type: string
          enum: [AgentOps]
        source:
          type: string
        issuer:
          type: string
        policy_owner:
          type: string
        policy_version:
          type: string
        can_ignore:
          type: boolean
        affected_actions:
          type: array
          items:
            type: string
    AgentStoreRunAuditSummary:
      type: object
      required: [audit_id, registration_state, event_count]
      properties:
        audit_id:
          type: string
        registration_state:
          type: string
          enum: [governed, suspected, degraded]
        event_count:
          type: integer
    AgentOpsDeepLinks:
      type: object
      required:
        - agent_id
        - version
        - session_id
        - run_id
        - installation_id
        - trace_id
        - audit_id
        - return_url
      properties:
        agent_id:
          type: string
        version:
          type: string
        session_id:
          type: string
        run_id:
          type: string
        installation_id:
          type: string
        trace_id:
          type: string
        audit_id:
          type: string
        return_url:
          type: string
    ErrorResponse:
      type: object
      required: [error_code, message, retryable]
      properties:
        error_code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        audit_id:
          type: string
        request_id:
          type: string
        denied_scope:
          type: string
