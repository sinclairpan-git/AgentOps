openapi: 3.1.0
info:
  title: AgentOps Trusted Loop API
  version: 0.1.0
paths:
  /v1/events/batch:
    post:
      summary: Ingest EventEnvelope v1 events
      operationId: ingestEventsBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  items:
                    $ref: "./event-envelope-v1.schema.yaml"
      responses:
        "202":
          description: Accepted or deduplicated events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionResult"
        "400":
          description: Schema or integration mode error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Signature or token error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/bootstrap/credentials:
    post:
      summary: Issue ReporterCredential, IngestionToken, and DeviceKey
      operationId: issueCredentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialIssueRequest"
      responses:
        "201":
          description: Credential issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialIssueResponse"
        "409":
          description: Expired or invalid bootstrap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/runs/{run_id}/evidence-summary:
    get:
      summary: Read redacted evidence summary for a run
      operationId: getEvidenceSummary
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Redacted evidence summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceSummary"
        "403":
          description: Raw access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/policy/decision:
    post:
      summary: Evaluate or retrieve a PolicyDecision
      operationId: evaluatePolicyDecision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyDecisionRequest"
      responses:
        "200":
          description: Policy decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDecision"
        "400":
          description: Policy scope missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/store-summary/{agent_id}:
    get:
      summary: Agent Store consumable AgentOps summary
      operationId: getAgentStoreSummary
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Agent Store summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStoreSummary"
        "409":
          description: Summary schema unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    IngestionResult:
      type: object
      required: [accepted, rejected, deduplicated]
      properties:
        accepted:
          type: array
          items:
            type: string
        rejected:
          type: array
          items:
            $ref: "#/components/schemas/EventError"
        deduplicated:
          type: array
          items:
            type: string
    EventError:
      type: object
      required: [event_id, error_code, retryable]
      properties:
        event_id:
          type: string
        error_code:
          type: string
        retryable:
          type: boolean
        human_action_required:
          type: boolean
    CredentialIssueRequest:
      type: object
      required:
        - bootstrap_id
        - installation_assertion
        - device_proof
      properties:
        bootstrap_id:
          type: string
        installation_assertion:
          $ref: "#/components/schemas/InstallationAssertion"
        device_proof:
          $ref: "#/components/schemas/DeviceProof"
    InstallationAssertion:
      type: object
      required:
        - issuer
        - key_id
        - algorithm
        - canonicalization
        - signature
        - installation_id
        - agent_id
        - agent_version
        - artifact_hash
        - user_id
        - device_id
        - nonce
        - issued_at
        - expires_at
      properties:
        issuer:
          type: string
        key_id:
          type: string
        algorithm:
          type: string
        canonicalization:
          type: string
          enum: [json-canonical-form]
        signature:
          type: string
        installation_id:
          type: string
        agent_id:
          type: string
        agent_version:
          type: string
        artifact_hash:
          type: string
        user_id:
          type: string
        device_id:
          type: string
        nonce:
          type: string
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    DeviceProof:
      type: object
      required:
        - device_id
        - public_key_hash
        - key_id
        - algorithm
        - nonce
        - signature
        - issued_at
        - expires_at
      properties:
        device_id:
          type: string
        public_key_hash:
          type: string
        key_id:
          type: string
        algorithm:
          type: string
        nonce:
          type: string
        signature:
          type: string
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    CredentialIssueResponse:
      type: object
      required: [credential_id, token_id, device_key_id, status, expires_at]
      properties:
        credential_id:
          type: string
        token_id:
          type: string
        device_key_id:
          type: string
        status:
          type: string
          enum: [active, rotating, expired, revoked]
        expires_at:
          type: string
          format: date-time
    EvidenceSummary:
      type: object
      required:
        - run_id
        - evidence_level
        - confidence
        - missing_evidence
        - raw_access_state
        - linked_event_ids
        - data_classification
        - redaction_policy
        - access_policy
        - retention_policy
        - redacted_summary
        - payload_hash
        - source_trust
        - completeness
        - freshness
        - downgrade_reason
      properties:
        run_id:
          type: string
        evidence_level:
          type: string
          enum: [L1, L2, L3, L4, L5, pending, unknown]
        confidence:
          type: number
        missing_evidence:
          type: array
          items:
            type: string
        raw_access_state:
          type: string
          enum: [not_available, summary_only, requestable, approved, denied, expired]
        linked_event_ids:
          type: array
          items:
            type: string
        data_classification:
          type: string
          enum: [public, internal, confidential, restricted]
        redaction_policy:
          type: string
        access_policy:
          type: string
        retention_policy:
          type: string
        redacted_summary:
          type: object
        payload_hash:
          type: string
        source_trust:
          type: string
          enum: [verified, declared, ai_suggested, imported, suspected]
        completeness:
          type: number
          minimum: 0
          maximum: 1
        freshness:
          type: string
          enum: [fresh, stale, unknown]
        downgrade_reason:
          type: string
    PolicyDecisionRequest:
      type: object
      required: [action]
      properties:
        run_id:
          type: string
        skill_id:
          type: string
        action:
          type: string
          enum: [read, write, execute, network, deploy, config_change]
        resource_scope:
          type: object
    PolicyDecision:
      type: object
      required: [decision, fallback_action, policy_version, decision_reason, audit_id]
      properties:
        decision:
          type: string
          enum: [block, approval_required, warn, conditional_allow, allow]
        fallback_action:
          type: string
          enum: [allow, warn, block, require_online]
        policy_version:
          type: string
        decision_reason:
          type: string
        audit_id:
          type: string
    AgentStoreSummary:
      type: object
      required:
        - agent_id
        - score_template_id
        - evidence_level
        - confidence
        - missing_evidence
        - risk_state
        - approval_state
        - calculated_at
        - valid_until
        - deep_links
      properties:
        agent_id:
          type: string
        agent_version:
          type: string
        evidence_level:
          type: string
          enum: [L1, L2, L3, L4, L5, pending, unknown]
        confidence:
          type: number
        missing_evidence:
          type: array
          items:
            type: string
        risk_state:
          type: string
          enum: [normal, warning, blocked, unknown]
        approval_state:
          type: string
          enum: [none, pending, approved, rejected, expired]
        score_template_id:
          type: string
        calculated_at:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        deep_links:
          $ref: "#/components/schemas/AgentOpsDeepLinks"
    AgentOpsDeepLinks:
      type: object
      required:
        - agent_id
        - version
        - session_id
        - run_id
        - installation_id
        - trace_id
        - audit_id
        - return_url
      properties:
        agent_id:
          type: string
        version:
          type: string
        session_id:
          type: string
        run_id:
          type: string
        installation_id:
          type: string
        trace_id:
          type: string
        audit_id:
          type: string
        return_url:
          type: string
    ErrorResponse:
      type: object
      required: [error_code, message, retryable]
      properties:
        error_code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        audit_id:
          type: string
        request_id:
          type: string
        denied_scope:
          type: string
