services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentops
      POSTGRES_USER: agentops
      POSTGRES_PASSWORD: agentops
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentops -d agentops"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - agentops-postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      target: agentops-api
    environment:
      AGENTOPS_DATABASE_URL: postgresql://agentops:agentops@postgres:5432/agentops
      AGENTOPS_POSTGRES_AUTO_MIGRATE: "true"
      AGENTOPS_ALLOWED_ORIGINS: http://127.0.0.1:4173,http://localhost:4173
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8765:8765"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/v1/health', timeout=3).read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  gateway:
    build:
      context: .
      target: agentops-gateway
    environment:
      AGENTOPS_GATEWAY_TOKEN: local-agentops-gateway-token
      AGENTOPS_UPSTREAM_BASE: http://api:8765
      AGENTOPS_GATEWAY_PRINCIPAL: producer.ai-sdlc.local
      AGENTOPS_GATEWAY_ROLES: agentops-ingestor
      AGENTOPS_GATEWAY_SCOPES: event.ingest
      AGENTOPS_GATEWAY_MAX_BODY_BYTES: "1048576"
      AGENTOPS_GATEWAY_UPSTREAM_TIMEOUT_SECONDS: "10"
      AGENTOPS_GATEWAY_RATE_LIMIT_PER_MINUTE: "600"
      AGENTOPS_GATEWAY_AUDIT_LOG: /tmp/agentops-gateway-audit.jsonl
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8766:8766"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/v1/health', timeout=3).read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  console:
    build:
      context: .
      target: agentops-console
      args:
        VITE_AGENTOPS_API_BASE: http://127.0.0.1:8766
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "4173:4173"

volumes:
  agentops-postgres-data:
